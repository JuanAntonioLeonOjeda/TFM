server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # Privacidad: la radiografía se pasa al backend en streaming, sin que nginx la guarde en un
        # temporal, y la respuesta (que lleva la imagen y el heatmap) tampoco se vuelca a disco
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_buffers 16 64k;
        proxy_max_temp_file_size 0;
    }

    # Los ficheros de Vite llevan hash en el nombre: se pueden cachear sin límite
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control no-cache;
        try_files $uri /index.html;
    }
}
